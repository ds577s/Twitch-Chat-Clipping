# Captions burned into clips (--captions, or the Captions switch in the dashboard).
# Edit here or on the dashboard's Captions page.

model: small            # tiny, base, small, medium, large-v3, turbo: bigger is more accurate but slower
language: "auto"        # auto, or a code like en, es, de
device: auto            # auto uses the GPU if it works, else the CPU

words_per_caption: 3
font: "Arial Black"
size: 76                # pixels on the 1080x1920 clip
uppercase: true
color: "#ffffff"
highlight: "#de4a4a"      # the word being spoken
outline: 6
position: auto          # auto (between facecam and gameplay, or lower middle), top, middle, bottom
mask_swears: false

# Names and slang Whisper should spell right (streamers, games, emotes).
vocabulary: []

# Words Whisper gets wrong, and what to write instead.
replace: {}

# Masked (f***) when mask_swears is on. Words starting with these count too.
swears:
  - "fuck"
  - "shit"
  - "bitch"
  - "cunt"
  - "dick"
  - "pussy"
  - "asshole"
  - "bastard"
  - "motherfuck"
