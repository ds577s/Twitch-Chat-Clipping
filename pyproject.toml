[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-spike-clipper"
version = "0.1.0"
description = "Find the best moments in Twitch VODs from chat spikes and cut vertical clips."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
# OpenCV 5 dropped the bundled Haar face detector, so stay on 4.x
facecam = ["opencv-python-headless>=4.5,<5"]
live = ["streamlink>=6", "yt-dlp"]

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools]
packages = ["clipper"]

[tool.setuptools.package-data]
clipper = ["config/*.yaml"]
